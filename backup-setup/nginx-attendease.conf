server {
    listen 130.1.35.63:80;
    listen 130.1.35.63:443 ssl;
    server_name 130.1.35.63 seedlab-workspace;

    ssl_certificate     /home/test/ssl/seedlab.crt;
    ssl_certificate_key /home/test/ssl/seedlab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        client_max_body_size 50M;
    }

    location / {
        try_files $uri /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    access_log /var/log/nginx/attendease.access.log;
    error_log  /var/log/nginx/attendease.error.log;
}
