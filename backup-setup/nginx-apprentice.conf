server {
    listen 130.1.35.64:80;
    listen 130.1.35.64:443 ssl;
    server_name 130.1.35.64;

    ssl_certificate     /home/test/ssl/apprentice.crt;
    ssl_certificate_key /home/test/ssl/apprentice.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /home/test/Desktop/seed_web_tdp/full-stack-app/frontend/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://130.1.35.63:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
        client_max_body_size 50M;
    }

    location / {
        proxy_pass http://130.1.35.63:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/apprentice.access.log;
    error_log  /var/log/nginx/apprentice.error.log;
}
